<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#151b24" />
  <title>ВалCAD — чертёж вала</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <header id="top">
      <button id="btnUndo" class="ib" title="Отменить">↶</button>
      <button id="btnRedo" class="ib" title="Вернуть">↷</button>
      <div id="title">ВалCAD</div>
      <div class="seg" id="mode2d3d">
        <button data-m="2d" class="on">2D</button><button data-m="3d">3D</button>
      </div>
      <button id="btnShare" class="ib accent" title="Отправить">➦</button>
    </header>
    <main id="viewport">
      <canvas id="cv"></canvas>
      <div id="v3d" hidden></div>
      <div id="ovl">
        <button id="btnFit" class="fab" title="Вписать">⤢</button>
        <button id="btnView" class="fab wide" title="Вид / разрез">Вид</button>
        <button id="btnSheet" class="fab wide" title="Лист / деталь">Лист</button>
        <button id="btnCut3d" class="fab wide" hidden>Разрез</button>
        <button id="btnBig" class="fab" title="Развернуть">▭</button>
      </div>
      <div id="info"></div>
      <button id="warn" hidden></button>
    </main>
    <section id="panel">
      <nav id="tabs">
        <button data-t="outer" class="on">Снаружи</button>
        <button data-t="innerL">Внутри ◂</button>
        <button data-t="innerR">Внутри ▸</button>
        <button data-t="sections">Сечения</button>
        <button data-t="sheet">Чертёж</button>
        <button data-t="file">Файл</button>
      </nav>
      <div id="content"></div>
    </section>
  </div>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
