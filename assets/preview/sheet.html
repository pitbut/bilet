<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#e9e7e2;font:13px system-ui,sans-serif;color:#222}
#wrap{position:relative} canvas{display:block}
.lab{position:absolute;width:210px;text-align:center;font-size:12px;line-height:14px}
.row{position:absolute;left:6px;width:110px;font-weight:600;font-size:14px}
h1{margin:0;padding:10px 14px;font-size:18px}
</style></head><body><h1 id="t"></h1><div id="wrap"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const sheet=new URLSearchParams(location.search).get('s');
const man=await (await fetch('../models/manifest.json')).json();
const CW=210,CH=190,LH=34,LEFT=120;
let rows;
if(sheet==='others'){const o=man.filter(m=>m.category!=='industry');rows=[];for(let i=0;i<o.length;i+=6)rows.push({name:'',items:o.slice(i,i+6)});document.getElementById('t').textContent='Олигарх · транспорт, энергетика, углы, фишки';}
else{const inds=sheet.split(',');rows=inds.map(id=>{const it=man.filter(m=>m.industry===id);return {name:it[0].industryName,items:['rent','income','special'].flatMap(b=>[1,2,3].map(l=>it.find(m=>m.branch===b&&m.level===l)))}});document.getElementById('t').textContent='Олигарх · отрасли: ветки × уровни 1–3';}
const cols=Math.max(...rows.map(r=>r.items.length));
const W=LEFT+cols*CW,H=rows.length*(CH+LH);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.outputColorSpace=THREE.SRGBColorSpace;r.setScissorTest(true);
const wrap=document.getElementById('wrap');wrap.style.width=W+'px';wrap.appendChild(r.domElement);
r.setClearColor(0xe9e7e2);r.clear();
const loader=new GLTFLoader();
for(const [ri,row] of rows.entries()){
 if(row.name){const d=document.createElement('div');d.className='row';d.style.top=(ri*(CH+LH)+CH/2-10)+'px';d.textContent=row.name;wrap.appendChild(d);}
 for(const [ci,m] of row.items.entries()){
  const g=await loader.loadAsync('../models/'+m.file);
  const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xffffff,0x8a8070,1.6));const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(2,4,3);s.add(dl);s.add(g.scene);
  const b=new THREE.Box3().setFromObject(g.scene),ce=b.getCenter(new THREE.Vector3());const tile=m.category!=='tokens'&&m.category!=='props';
  const sz=tile?3.1:b.getSize(new THREE.Vector3()).length()*1.5;
  const c=new THREE.PerspectiveCamera(30,CW/CH,0.01,100);c.position.set(ce.x+sz*0.62,(tile?0.35:ce.y)+sz*0.62,ce.z+sz*0.9);c.lookAt(tile?new THREE.Vector3(0,0.35,0):ce);
  const x=LEFT+ci*CW,y=ri*(CH+LH);
  r.setViewport(x,H-y-CH,CW,CH);r.setScissor(x,H-y-CH,CW,CH);r.render(s,c);
  const l=document.createElement('div');l.className='lab';l.style.left=x+'px';l.style.top=(y+CH)+'px';
  l.textContent=m.category==='industry'?`${m.branchName} · ур. ${m.level}`:m.name;wrap.appendChild(l);
 }}
document.title='done';
</script></body></html>
